<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Limpar Cache</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #233E97 0%, #1a2a5c 100%);
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #233E97;
            margin-bottom: 20px;
        }
        .status {
            font-size: 18px;
            color: #333;
            margin: 15px 0;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #233E97;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔄 Limpando Cache...</h1>
        <div class="spinner"></div>
        <div class="status" id="status">Removendo dados locais...</div>
    </div>

    <script>
        // Limpar localStorage
        localStorage.clear();
        document.getElementById('status').textContent = '✅ Cache limpo com sucesso!';
        
        // Aguardar 2 segundos e redirecionar
        setTimeout(() => {
            document.getElementById('status').textContent = '🔄 Redirecionando para trilha...';
            window.location.href = 'http://localhost:5173/trails/45';
        }, 2000);
    </script>
</body>
</html>
